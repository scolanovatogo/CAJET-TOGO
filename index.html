<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAJET</title>
<style>
:root{--b:#0b5cab;--r:#d32f2f;--bg:#f4f6fa;--c:#fff;--t:#1a1d24;--m:#667;--l:#dde2ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1e232b;--t:#e8ebf0;--m:#99a;--l:#323a46}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--b);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;letter-spacing:2px}header small{display:block;opacity:.85;font-size:11px}
main{padding:12px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:12px 2px;font-size:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.st{text-align:center}.st b{display:block;font-size:22px;color:var(--b)}
button,.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px}
button.g{background:var(--l);color:var(--t)}button.r{background:var(--r)}
.grid button{padding:16px 8px}
input,select{width:100%;padding:10px;margin:3px 0 10px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font-size:16px}
label{font-size:13px;color:var(--m);display:block}
.er{color:var(--r);min-height:18px;margin:0 0 8px}
#m{display:none;position:fixed;inset:0;background:#0007;z-index:9;align-items:flex-end}
#m.on{display:flex}.sheet{background:var(--c);width:100%;max-height:92vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}th{background:var(--bg)}
.rc{border:1px dashed var(--m);padding:12px;margin-bottom:14px;background:var(--c)}
.chip{background:#fff3;border-radius:12px;padding:2px 10px;font-size:12px}
@media print{header,nav,.np,#m{display:none!important}body{background:#fff;color:#000;padding:0}}
.lg{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}header>div{display:flex;align-items:center;gap:10px;min-width:0}
.dh{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--b);padding-bottom:8px;margin-bottom:10px}.dh img{width:64px;height:64px;object-fit:contain;flex:none}.dh b{font-size:20px;color:var(--b);letter-spacing:2px}.dh span{display:block;font-size:12px;color:var(--m)}.rc .dh img{width:48px;height:48px}.rc .dh b{font-size:16px}
@media print{.dh,.dh img{-webkit-print-color-adjust:exact;print-color-adjust:exact}.dh span{color:#444}}
</style></head><body>

 $('#rf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const u=f.u.trim().toLowerCase(),code=f.c.replace(/[\s-]/g,'').toUpperCase(),id=await uid(u);mdpOk(f.p,u);if(f.p!==f.p2)E('Les deux mots de passe ne sont pas identiques');
  if(!TEN0){const ix=await(await fg('idx/'+id)).json();if(!ix)E('Identifiant inconnu');TEN=ix}await licence();
  const w=await(await fj('rk/'+id)).json()||E("Aucun code de secours n'a été enregistré pour ce compte.");
  try{KD=await unwrap(code,w)}catch(x){E('Code de secours incorrect')}
  await pull();if(D.auth.user!==u)E('Identifiant inconnu');D.auth.admin=await H(f.p);await putWrap('ku',u,f.p,KD);save();await PQ;KD=null;alert('Votre mot de passe a été réinitialisé. Connectez-vous avec le nouveau mot de passe.');loginView()}catch(x){$('#er').textContent=x.message}}}
async function chPwd(){form('Changer mon mot de passe',[{n:'o',l:'Ancien mot de passe',t:'password',r:1},{n:'n',l:'Nouveau mot de passe (10 caractères minimum)',t:'password',r:1},{n:'n2',l:'Confirmer le nouveau mot de passe',t:'password',r:1}],async f=>{
 const c=A()?null:D.cais.find(x=>x.nom==S.nom),cur=A()?D.auth.admin:c&&c.h;if(await H(f.o)!=cur)E('Ancien mot de passe incorrect');mdpOk(f.n,'');if(f.n!==f.n2)E('Les deux mots de passe ne sont pas identiques');
 const h=await H(f.n);if(FB)await putWrap('ku',A()?D.auth.user:c.nom,f.n,KD);if(A())D.auth.admin=h;else c.h=h;save();cl();alert('Mot de passe modifié.')},'Modifier')}
function resetCais(){if(!adminOnly())return;if(!D.cais.length)return alert('Aucun caissier enregistré.');form("Nouveau mot de passe d'un caissier",[{n:'id',l:'Caissier',t:'select',o:D.cais.map(c=>[c.id,c.nom+' '+c.pre])},{n:'n',l:'Nouveau mot de passe',t:'password',r:1}],async f=>{const c=D.cais.find(x=>x.id==f.id)||E('Caissier introuvable');mdpOk(f.n,'');c.h=await H(f.n);if(FB)await putWrap('ku',c.nom,f.n,KD);save();cl();alert('Mot de passe de '+c.nom+' modifié.')},'Modifier')}
loginView();
